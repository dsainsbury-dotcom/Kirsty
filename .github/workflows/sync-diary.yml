name: Sync Google diary

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - '.github/workflows/sync-diary.yml'
      - 'scripts/sync_diary.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Sync diary from Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python scripts/sync_diary.py

      - name: Commit updated diary data
        run: |
          if git diff --quiet -- data/home-diary.json; then
            echo "No diary changes to commit."
            exit 0
          fi
          git config user.name "kirsty-diary-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/home-diary.json
          git commit -m "Sync diary from Google Sheets"
          git push
